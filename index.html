<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Pintar Digital Marketing - Panduan Lengkap Alwustho Group</title>
    <!-- Chart.js CDN for Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            font-size: 1.05rem;
        }
        header {
            background: linear-gradient(135deg, #1b365d, #2c3e50);
            color: white;
            text-align: center;
            padding: 3.5rem 1.5rem;
        }
        header h1 { margin: 0; font-size: 2.8rem; font-weight: 700; }
        header p { font-size: 1.25rem; color: #d0d7de; margin-top: 12px; }

        .container { max-width: 1050px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 14px; padding: 3rem 2.5rem; margin-bottom: 3rem; box-shadow: 0 6px 20px rgba(0,0,0,0.06); border-top: 8px solid #2980b9; }
        
        h2 { color: #1b365d; border-bottom: 3px solid #ecf0f1; padding-bottom: 15px; margin-top: 0; font-size: 2rem; }
        h3 { color: #2980b9; font-size: 1.4rem; margin-top: 2rem; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 25px; }
        @media (max-width: 768px) { .info-grid { grid-template-columns: 1fr; } }
        
        .box-section { background-color: #fdfefe; border: 2px solid #e2e8f0; padding: 25px; border-radius: 10px; }
        .box-section h4 { margin-top: 0; color: #1b365d; font-size: 1.2rem; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; }

        .extra-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 25px; }
        .benchmark-box { background-color: #f0fdf4; border: 2px solid #86efac; padding: 25px; border-radius: 10px; }
        .trouble-box { background-color: #fef2f2; border: 2px solid #fca5a5; padding: 25px; border-radius: 10px; }

        .video-section { margin-top: 30px; background: #f8fafc; padding: 25px; border-radius: 10px; border: 2px dashed #3498db; text-align: center; }
        .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-top: 15px; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Data Section Styles */
        .live-data-container { background: #ffffff; border: 3px solid #2c3e50; padding: 30px; margin: 30px auto; max-width: 1050px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .chart-wrapper { width: 100%; max-height: 400px; margin-top: 20px; }

        .ai-helper-box { background: linear-gradient(135deg, #1b365d, #2980b9); color: white; text-align: center; padding: 3.5rem 2rem; border-radius: 14px; margin-top: 3rem; }
        .ai-btn { background-color: #ffffff; color: #1b365d; padding: 18px 40px; text-decoration: none; border-radius: 35px; font-weight: bold; display: inline-block; margin-top: 25px; }
    </style>
</head>
<body>

    <header>
        <h1>Buku Pintar Pemasaran Digital</h1>
        <p>Panduan Sangat Terperinci untuk Pemilik Usaha</p>
    </header>

    <div class="container">
        <!-- Content Modules (1, 2, 3) remain here as defined previously -->
        <!-- [Insert your existing Card components here] -->
    </div>

    <!-- NEW: Live Data Section moved to the bottom -->
    <div class="container">
        <div class="live-data-container">
            <h3>📈 Data & Tren Pasar Digital Saat Ini</h3>
            <p id="loading-text">Menghubungkan ke server data pemasaran global...</p>
            <div class="chart-wrapper">
                <canvas id="marketingChart"></canvas>
            </div>
            <p style="margin-top:20px; font-size: 0.9rem; color: #7f8c8d;">*Data disimulasikan berdasarkan rata-rata konversi industri 2026.</p>
        </div>
    </div>

    <div class="container">
        <!-- BAGIAN BANTUAN ASISTEN AI -->
        <div class="ai-helper-box">
            <h3>🤖 Butuh Bantuan Tambahan?</h3>
            <a href="https://gemini.google.com" target="_blank" class="ai-btn">💬 Tanya Asisten AI Sekarang</a>
        </div>
    </div>

    <script>
        // Data Visualization Logic
        const ctx = document.getElementById('marketingChart').getContext('2d');
        
        // Simulate "Live" Fetching
        setTimeout(() => {
            document.getElementById('loading-text').innerText = "✅ Data terkini berhasil dimuat.";
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Google Maps', 'Meta Ads', 'Google Ads', 'Email Mkt'],
                    datasets: [{
                        label: 'Tingkat Kepercayaan Konsumen (%)',
                        data: [88, 65, 72, 45],
                        backgroundColor: ['#2980b9', '#3498db', '#f1c40f', '#e67e22'],
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, max: 100 } }
                }
            });
        }, 1500); // Simulated delay
    </script>
</body>
</html>
