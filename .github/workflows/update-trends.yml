name: Update Trends Data

on:
  schedule:
    # Runs at 00:00 UTC every day (07:00 AM WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # This allows you to click a button to run it manually right now!

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        run: node fetch-trends.js

      - name: Commit and Push trends.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add trends.json
          git commit -m "Automated update: new trend data" || echo "No changes to commit"
          git push
